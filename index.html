<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLVAK Teklif Hazırlama Sistemi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8edf5 0%, #f5f7fa 100%);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 30px 20px;
        }
        .logo-header { text-align: center; margin-bottom: 40px; }
        .logo-header img { max-width: 320px; width: 60vw; min-width: 160px; height: auto; display: block; margin: 0 auto; }
        .logo-header p { color: #7f8c8d; font-size: 14px; margin-top: 10px; }
        .cards-container { display: flex; gap: 20px; flex-wrap: nowrap; justify-content: center; max-width: 100%; width: 100%; }
        .card {
            background: white; border-radius: 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            padding: 30px 24px; width: 280px; min-width: 0; flex: 1 1 220px; max-width: 320px;
            text-align: center; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s; text-decoration: none;
            display: flex; flex-direction: column; align-items: center; gap: 16px; border: 3px solid transparent;
        }
        .card:hover { transform: translateY(-6px); box-shadow: 0 14px 40px rgba(0,0,0,0.18); }
        .card.mavi-alev { border-color: #002366; }
        .card.mavi-alev:hover { border-color: #0048ce; }
        .card.yonca { border-color: #27ae60; }
        .card.yonca:hover { border-color: #1e8449; }
        .card-icon { width: 110px; height: 110px; object-fit: contain; }
        .card h2 { font-size: 1.4rem; font-weight: 700; }
        .card.mavi-alev h2 { color: #002366; }
        .card.yonca h2 { color: #1e8449; }
        .card p { font-size: 13px; color: #666; line-height: 1.55; }
        .card-btn {
            margin-top: 10px; padding: 12px 28px; border: none; border-radius: 8px;
            font-weight: bold; font-size: 14px; color: white; cursor: pointer; transition: background 0.2s;
        }
        .card.mavi-alev .card-btn { background-color: #0048ce; }
        .card.mavi-alev .card-btn:hover { background-color: #002879; }
        .card.yonca .card-btn { background-color: #27ae60; }
        .card.yonca .card-btn:hover { background-color: #1e8449; }
        .footer-note { margin-top: 50px; font-size: 11px; color: #aaa; text-align: center; }
        @media (max-width: 520px) {
            .cards-container { gap: 10px; }
            .card { padding: 16px 10px; flex: 1 1 0; width: auto; max-width: none; min-width: 0; }
            .card-icon { width: 70px; height: 70px; }
            .card h2 { font-size: 1rem; }
            .card p { font-size: 11px; }
            .card-btn { padding: 9px 10px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="logo-header">
        <img src="polvak yazı-2.png" alt="POLVAK Logo">
        <p>Teklif Hazırlama Sistemi</p>
    </div>
    <div class="cards-container">
        <a class="card mavi-alev" href="mavi_alev.html">
            <img class="card-icon" src="mavi alev logo.png" alt="Mavi Alev Logo">
            <h2>Mavi Alev</h2>
            <p>Otel sınıfı, işletme türü ve paket seçimine göre ayrıntılı hesaplama yapar.</p>
            <button class="card-btn"><i class="fas fa-arrow-right"></i> Hesaplamaya Git</button>
        </a>
        <a class="card yonca" href="yonca.html">
            <img class="card-icon" src="yonca.png" alt="Yonca Logo">
            <h2>Yonca</h2>
            <p>Personel sayısı ve oran bazlı basit hesaplama yapar. Hızlı teklif için idealdir.</p>
            <button class="card-btn"><i class="fas fa-arrow-right"></i> Hesaplamaya Git</button>
        </a>
    </div>
    <div class="footer-note">
        Kıbrıs Türk Polis Güçlendirme Vakfı (POLVAK) &copy; 2026
    </div>
</body>
</html>
