<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangın Eğitimi Maliyet Hesaplama (POLVAK)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #e8f6f3;
            border-left: 5px solid #1abc9c;
            display: none;
        }

        .result-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .total-line {
            font-weight: bold;
            font-size: 20px;
            color: #c0392b;
            border-top: 2px solid #bdc3c7;
            padding-top: 10px;
        }

        .hidden {
            display: none;
        }

        .note {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🔥 Yangın Eğitimi Maliyet Hesaplayıcı</h1>

        <div class="form-group">
            <label>Brüt Asgari Ücret (TL):</label>
            <input type="number" id="asgariUcret" value="35180">
        </div>

        <div class="form-group">
            <label>İşletme Türü:</label>
            <select id="isletmeTuru" onchange="toggleOtelSecenekleri()">
                <option value="diger">Diğer İşletmeler (Küçük İşletme/Kurum)</option>
                <option value="otel">Otel / Turistik Tesis</option>
            </select>
        </div>

        <div class="form-group hidden" id="otelSinifiGroup">
            <label>Otel Sınıfı:</label>
            <select id="otelSinifi">
                <option value="1">1 Yıldız / Bungalov</option>
                <option value="2">2 Yıldız</option>
                <option value="3">3 Yıldız / Özel Belgeli / 2. Sınıf T.K.</option>
                <option value="4">4 Yıldız / Butik Otel</option>
                <option value="5">5 Yıldız / 1. Sınıf T.K.</option>
            </select>
        </div>

        <div class="form-group">
            <label>Toplam Personel Sayısı (Eğitim Alacak):</label>
            <input type="number" id="personelSayisi" value="10">
        </div>

        <div class="form-group">
            <label>Paket Seçimi:</label>
            <select id="paketSecimi" onchange="toggleSertifika()">
                <option value="1">Paket 1 (Temel Yangın Eğitimi)</option>
                <option value="2">Paket 2 (Tatbikat Dahil)</option>
                <option value="3">Paket 3 (Sadece Denetim)</option>
                <option value="4">Paket 4 (Full Paket + Sertifika)</option>
            </select>
        </div>

        <div class="form-group hidden" id="sertifikaGroup">
            <label>İlk Müdahale Ekibi Sayısı (Sertifika Alacak):</label>
            <input type="number" id="mudahaleSayisi" value="5">
            <div class="note">* Paket 4 seçildiği için bu alan zorunludur.</div>
        </div>

        <button class="btn" onclick="hesapla()">HESAPLA</button>

        <div class="result-box" id="sonucEkrani">
            <div id="sonucDetay"></div>
            <div class="result-line total-line">
                <span>ÖDENECEK NET TUTAR:</span>
                <span id="netTutar">0.00 TL</span>
            </div>
        </div>
    </div>

    <script>
        // Belge verilerine göre oranlar
        const otelOranlar = {
            "1": { sabit: 0.10, kisi: 0.01, denetim: 0.60 }, // [cite: 13, 14, 46]
            "2": { sabit: 0.10, kisi: 0.011, denetim: 0.65 }, // [cite: 16, 17, 47]
            "3": { sabit: 0.15, kisi: 0.012, denetim: 0.70 }, // [cite: 19, 20, 48]
            "4": { sabit: 0.20, kisi: 0.013, denetim: 0.75 }, // [cite: 22, 23, 49]
            "5": { sabit: 0.25, kisi: 0.015, denetim: 0.80 }  // [cite: 25, 26, 50]
        };

        const digerOranlar = { sabit: 0.10, kisi: 0.01, denetim: 0.60 }; // [cite: 92, 112]

        function toggleOtelSecenekleri() {
            const tur = document.getElementById("isletmeTuru").value;
            const div = document.getElementById("otelSinifiGroup");
            div.style.display = (tur === "otel") ? "block" : "none";
        }

        function toggleSertifika() {
            const paket = document.getElementById("paketSecimi").value;
            const div = document.getElementById("sertifikaGroup");
            div.style.display = (paket === "4") ? "block" : "none";
        }

        function formatTL(money) {
            return money.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " TL";
        }

        function hesapla() {
            // Girdileri Al
            const asgariUcret = parseFloat(document.getElementById("asgariUcret").value);
            const isletmeTuru = document.getElementById("isletmeTuru").value;
            const personelSayisi = parseInt(document.getElementById("personelSayisi").value) || 0;
            const paket = document.getElementById("paketSecimi").value;

            let oran = {};
            if (isletmeTuru === "otel") {
                const sinif = document.getElementById("otelSinifi").value;
                oran = otelOranlar[sinif];
            } else {
                oran = digerOranlar;
            }

            // Hesaplamalar
            // 1. Paket Hesabı [cite: 10]
            const sabitUcret = asgariUcret * oran.sabit;
            const belgeUcreti = personelSayisi * (asgariUcret * oran.kisi);
            const p1_toplam = sabitUcret + belgeUcreti;

            // 3. Paket (Denetim) Hesabı [cite: 45]
            const p3_toplam = asgariUcret * oran.denetim;

            let toplamTutar = 0;
            let detayHTML = "";
            let indirimTutari = 0;

            if (paket === "1") {
                toplamTutar = p1_toplam;
                detayHTML += `<div class='result-line'><span>Paket 1 (Temel):</span> <span>${formatTL(p1_toplam)}</span></div>`;
            }
            else if (paket === "2") {
                // Paket 2 = P1 + 1 Asgari Ücret [cite: 43]
                toplamTutar = p1_toplam + asgariUcret;
                detayHTML += `<div class='result-line'><span>Paket 1:</span> <span>${formatTL(p1_toplam)}</span></div>`;
                detayHTML += `<div class='result-line'><span>Tatbikat Farkı (1 ASG):</span> <span>${formatTL(asgariUcret)}</span></div>`;
            }
            else if (paket === "3") {
                // Sadece Paket 3 [cite: 45]
                toplamTutar = p3_toplam;
                detayHTML += `<div class='result-line'><span>Paket 3 (Denetim):</span> <span>${formatTL(p3_toplam)}</span></div>`;
            }
            else if (paket === "4") {
                // Paket 4 = P1 + Tatbikat + P3 + Sertifika [cite: 52]
                const mudahaleSayisi = parseInt(document.getElementById("mudahaleSayisi").value) || 0;
                const sertifikaMaliyeti = mudahaleSayisi * (asgariUcret * 0.10); // [cite: 58]

                const hamToplam = p1_toplam + asgariUcret + p3_toplam + sertifikaMaliyeti;

                // %35 İndirim [cite: 59, 154]
                indirimTutari = hamToplam * 0.35;
                toplamTutar = hamToplam - indirimTutari;

                detayHTML += `<div class='result-line'><span>Paket 1 (Temel):</span> <span>${formatTL(p1_toplam)}</span></div>`;
                detayHTML += `<div class='result-line'><span>Paket 2 (Tatbikat Farkı):</span> <span>${formatTL(asgariUcret)}</span></div>`;
                detayHTML += `<div class='result-line'><span>Paket 3 (Denetim):</span> <span>${formatTL(p3_toplam)}</span></div>`;
                detayHTML += `<div class='result-line'><span>Sertifika (${mudahaleSayisi} Kişi):</span> <span>${formatTL(sertifikaMaliyeti)}</span></div>`;
                detayHTML += `<div class='result-line' style='color:gray'><em>Ara Toplam:</em> <em>${formatTL(hamToplam)}</em></div>`;
                detayHTML += `<div class='result-line' style='color:green'><strong>%35 İndirim:</strong> <strong>-${formatTL(indirimTutari)}</strong></div>`;
            }

            // Sonucu Yazdır
            document.getElementById("sonucDetay").innerHTML = detayHTML;
            document.getElementById("netTutar").innerText = formatTL(toplamTutar);
            document.getElementById("sonucEkrani").style.display = "block";
        }
    </script>

</body>

</html>
